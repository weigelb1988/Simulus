# @package _global_
defaults:
  - _self_
  - override /tokenizer: atari
  - override /world_model: atari
  - override /actor_critic: atari
  - override /env: atari
  - override /datasets: default

wandb:
  tags: null
  notes: null

common:
  epochs: 600

collection:
  train:
    stop_after_epochs: 500
    config:
      epsilon: 0.01
      num_steps: 200
  test:
    num_envs: 8
    num_episodes_to_save: ${collection.train.num_episodes_to_save}
    store_dataset: False
    config:
      num_episodes: 16
      num_episodes_end: 100

training:
  tokenizer:
    start_after_epochs: 5
    steps_per_epoch: 100  # Reduced for larger batches
  world_model:
    batch_num_samples: 1024  # H200: extreme batches, 92% memory free
    start_after_epochs: 25
    steps_per_epoch: 100  # Fewer steps with 2x batch
  actor_critic:
    learning_rate: 2e-4
    batch_num_samples: 1024  # H200: extreme batches
    start_after_epochs: 50
    critic_warmup_epochs: 0
    steps_per_epoch: 40  # Half steps for 2x batch

evaluation:
  every: 20
